<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivi Heures</title>
  <meta name="description" content="Pointage, planning, soldes de congés et statistiques de temps de travail">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="meta-theme" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <script>
    // Thème appliqué avant l'affichage (évite le flash blanc en mode sombre)
    (function () {
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem('sh_prefs') || '{}').theme) || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('meta-theme').setAttribute('content', dark ? '#111827' : '#ffffff');
    })();
  </script>
  <link rel="preconnect" href="https://rxqtsguwoqeojsnaagxb.supabase.co" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="splash" class="splash"><div class="spinner"></div></div>

  <!-- CONNEXION -->
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h1>Suivi Heures</h1>
      <p class="muted">Connectez-vous pour pointer et suivre votre temps.</p>
      <form id="login-form">
        <label class="field"><span>Email</span><input class="input" type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Mot de passe</span><input class="input" type="password" id="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="login-btn">Se connecter</button>
        <p class="small neg" id="login-error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- APPLICATION -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><img src="icons/icon-192.png" alt=""> Suivi Heures</div>
      <nav id="nav-side" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="avatar">--</div>
          <div class="who"><div class="strong" id="user-name">…</div><div class="xs muted" id="user-email"></div></div>
        </div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="page-title">Pointage</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>

      <section id="view-pointage" class="view" aria-label="Pointage"></section>
      <section id="view-planning" class="view" aria-label="Planning"></section>
      <section id="view-stats" class="view" aria-label="Statistiques"></section>
      <section id="view-donnees" class="view" aria-label="Exports et sauvegardes"></section>
      <section id="view-reglages" class="view" aria-label="Réglages"></section>
    </main>

    <nav class="bottomnav" id="nav-bottom" aria-label="Navigation"></nav>
  </div>

  <!-- DIALOGUES -->
  <dialog id="dlg-day"><div class="dlg">
    <div class="dlg-head"><h2 id="day-title">Journée</h2><button class="btn btn-ghost icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <div id="day-summary" class="mini-stats"></div>
      <div id="day-absences"></div>
      <div id="day-events" class="events"></div>
      <div class="card flat" style="padding:12px">
        <div class="label" style="margin-bottom:8px">Ajouter un pointage</div>
        <form id="day-add" class="day-add">
          <select class="select sm" id="day-add-type">
            <option value="arrivee">Arrivée / reprise</option>
            <option value="pause">Début de pause</option>
            <option value="depart">Départ</option>
          </select>
          <input class="input sm" type="time" id="day-add-time" required>
          <button class="btn btn-primary btn-sm" type="submit">Ajouter</button>
        </form>
      </div>
    </div>
    <div class="dlg-foot"><button class="btn" id="day-to-absence">Déclarer une absence ce jour</button></div>
  </div></dialog>

  <dialog id="dlg-pointage"><form class="dlg" id="pointage-form">
    <div class="dlg-head"><h2>Modifier le pointage</h2><button type="button" class="btn btn-ghost icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <p class="muted small" id="pointage-desc"></p>
      <input class="input big-time" type="time" id="pointage-time" required>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger left" id="pointage-delete">Supprimer</button>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form></dialog>

  <dialog id="dlg-absence"><form class="dlg" id="absence-form">
    <div class="dlg-head"><h2 id="absence-title">Nouvelle absence</h2><button type="button" class="btn btn-ghost icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body">
      <label class="field"><span>Type</span><select class="select" id="abs-type"></select></label>
      <div class="field"><span class="label">Durée</span>
        <div class="seg" id="abs-moment">
          <button type="button" data-v="journee" aria-pressed="true">Journée(s)</button>
          <button type="button" data-v="matin" aria-pressed="false">Matin</button>
          <button type="button" data-v="aprem" aria-pressed="false">Après-midi</button>
        </div>
      </div>
      <div class="grid g2">
        <label class="field"><span>Du</span><input class="input" type="date" id="abs-start" required></label>
        <label class="field"><span>Au</span><input class="input" type="date" id="abs-end" required></label>
      </div>
      <p class="small muted" id="abs-count"></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger left" id="abs-delete" hidden>Supprimer</button>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form></dialog>

  <dialog id="dlg-confirm"><form class="dlg" method="dialog">
    <div class="dlg-head"><h2 id="confirm-title">Confirmer</h2></div>
    <div class="dlg-body"><div id="confirm-body"></div></div>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Annuler</button>
      <button class="btn btn-primary" value="ok" id="confirm-ok">Confirmer</button>
    </div>
  </form></dialog>

  <dialog id="dlg-counters"><div class="dlg">
    <div class="dlg-head"><h2>Compteurs masqués</h2><button class="btn btn-ghost icon-btn" data-close aria-label="Fermer">✕</button></div>
    <div class="dlg-body"><div id="hidden-counters" class="list"></div></div>
  </div></dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="chart-tip" class="chart-tip" role="tooltip"></div>
</body>
</html>
