<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mes Horaires & Planning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        .fc { font-family: inherit; }
        .fc-button-primary { background-color: #14b8a6 !important; border-color: #14b8a6 !important; }
        .fc-button-primary:hover { background-color: #0d9488 !important; border-color: #0d9488 !important; }
        .fc-button-active { background-color: #0f766e !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 md:p-6 font-sans">

    <!-- CONNEXION -->
    <div id="auth-section" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Connexion</h2>
        <input type="email" id="email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-teal-500">
        <input type="password" id="password" placeholder="Mot de passe" class="w-full p-3 border border-gray-300 rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-teal-500">
        <button onclick="login()" class="w-full bg-teal-500 text-white font-bold py-3 rounded-xl hover:bg-teal-600 transition shadow-lg">Se connecter</button>
    </div>

    <!-- APP -->
    <div id="app-section" class="hidden w-full max-w-5xl bg-white md:rounded-3xl shadow-2xl flex-col md:flex-row overflow-hidden min-h-[85vh]">
        
        <!-- MENU GAUCHE -->
        <div class="md:w-1/4 bg-gray-50 border-r border-gray-200 p-6 flex flex-col">
            <div class="text-teal-500 font-bold text-xl flex items-center justify-center gap-2 mb-8">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg>
                MON SIRH
            </div>

            <nav class="flex flex-col gap-2 mb-8">
                <button onclick="switchTab('pointage')" id="btn-pointage" class="flex items-center gap-3 p-3 rounded-xl bg-teal-50 text-teal-700 font-medium transition">
                    Pointage du jour
                </button>
                <button onclick="switchTab('planning')" id="btn-planning" class="flex items-center gap-3 p-3 rounded-xl text-gray-600 hover:bg-gray-100 font-medium transition">
                    Planning & Congés
                </button>
            </nav>

            <div class="mt-auto pt-6 border-t border-gray-200 text-center">
                <div id="date-display" class="text-gray-500 text-sm font-medium capitalize"></div>
                <div id="time-display" class="text-3xl font-bold text-gray-800 tracking-tight mt-1"></div>
            </div>
        </div>

        <!-- ZONE DROITE -->
        <div class="md:w-3/4 flex flex-col p-4 md:p-8 relative">
            
            <!-- VUE 1 : POINTAGE (Dynamique) -->
            <div id="view-pointage" class="flex-1 flex flex-col">
                <div class="flex flex-col items-center mt-2 mb-6">
                    <h2 class="text-2xl font-medium text-gray-800">Suivi d'activité</h2>
                    <span class="text-sm text-gray-500">Aujourd'hui</span>
                </div>

                <!-- HISTORIQUE CENTRAL DEPUIS SUPABASE -->
                <div class="flex-1 overflow-y-auto mb-8 px-2 space-y-2 border-t border-b border-gray-100 py-4" id="historique-jour">
                    <div class="flex justify-center items-center h-full text-gray-400">Chargement de l'historique...</div>
                </div>

                <!-- BOUTONS -->
                <div class="grid grid-cols-3 gap-3 md:gap-4 mt-auto">
                    <button onclick="pointer('arrivee')" class="bg-teal-500 hover:bg-teal-600 text-white py-4 md:py-6 rounded-2xl flex flex-col items-center justify-center transition shadow-md active:scale-95">
                        <span class="text-sm md:text-base font-medium">Arrivée</span>
                    </button>
                    <button onclick="pointer('pause')" class="bg-orange-500 hover:bg-orange-600 text-white py-4 md:py-6 rounded-2xl flex flex-col items-center justify-center transition shadow-md active:scale-95">
                        <span class="text-sm md:text-base font-medium">Pause</span>
                    </button>
                    <button onclick="pointer('depart')" class="bg-slate-500 hover:bg-slate-600 text-white py-4 md:py-6 rounded-2xl flex flex-col items-center justify-center transition shadow-md active:scale-95">
                        <span class="text-sm md:text-base font-medium">Départ</span>
                    </button>
                </div>
            </div>

            <!-- VUE 2 : PLANNING -->
            <div id="view-planning" class="hidden flex-1 flex flex-col h-full">
                
                <!-- Bouton de paramétrage des soldes -->
                <div class="flex justify-end mb-2">
                    <button onclick="ouvrirModalParametres()" class="text-sm text-teal-600 hover:underline flex items-center gap-1">
                        ⚙️ Modifier mes soldes de départ
                    </button>
                </div>

                <!-- Compteurs (Calculés) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div class="text-xs text-gray-500 font-bold uppercase mb-1">Heures Sup</div>
                        <div class="text-xl font-bold text-teal-600" id="cpt-heures">--</div>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div class="text-xs text-gray-500 font-bold uppercase mb-1">CP Restants</div>
                        <div class="text-xl font-bold text-gray-800" id="cpt-cp">-- j</div>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 relative">
                        <div class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full animate-pulse hidden" id="alerte-rtt">1 à poser !</div>
                        <div class="text-xs text-blue-600 font-bold uppercase mb-1">RTT Restants</div>
                        <div class="text-xl font-bold text-blue-800" id="cpt-rtt">-- j</div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-xl border border-purple-100">
                        <div class="text-xs text-purple-600 font-bold uppercase mb-1">Fractionnement</div>
                        <div class="text-xl font-bold text-purple-800" id="cpt-fractionnement">+0 j</div>
                    </div>
                </div>

                <button onclick="ouvrirModalAbsence()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl mb-6 shadow-md hover:bg-slate-700">
                    + Déclarer une absence
                </button>

                <div id="calendar" class="flex-1 min-h-[400px]"></div>
            </div>
            
        </div>
    </div>

    <!-- MODAL : ABSENCE -->
    <div id="modal-absence" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Nouvelle absence</h3>
            <select id="type_absence" class="w-full p-3 border border-gray-300 rounded-xl mb-4">
                <option value="RTT">RTT</option>
                <option value="CP">Congé Payé</option>
                <option value="Maladie">Arrêt Maladie</option>
                <option value="Formation">Formation</option>
            </select>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div><label class="text-xs font-bold text-gray-500">Du</label><input type="date" id="date_debut" class="w-full p-2 border rounded-xl mt-1"></div>
                <div><label class="text-xs font-bold text-gray-500">Au</label><input type="date" id="date_fin" class="w-full p-2 border rounded-xl mt-1"></div>
            </div>
            <div class="flex gap-3">
                <button onclick="fermerModalAbsence()" class="flex-1 bg-gray-200 font-bold py-3 rounded-xl">Annuler</button>
                <button onclick="sauvegarderAbsence()" class="flex-1 bg-teal-500 text-white font-bold py-3 rounded-xl">Valider</button>
            </div>
        </div>
    </div>

    <!-- MODAL : PARAMETRES -->
    <div id="modal-parametres" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Mes Soldes (Acquis)</h3>
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-500">Nombre de CP total</label>
                <input type="number" id="input_cp" class="w-full p-3 border rounded-xl mt-1" value="25">
            </div>
            <div class="mb-6">
                <label class="text-xs font-bold text-gray-500">Nombre de RTT total</label>
                <input type="number" id="input_rtt" class="w-full p-3 border rounded-xl mt-1" value="15">
            </div>
            <div class="flex gap-3">
                <button onclick="fermerModalParametres()" class="flex-1 bg-gray-200 font-bold py-3 rounded-xl">Annuler</button>
                <button onclick="sauvegarderParametres()" class="flex-1 bg-teal-500 text-white font-bold py-3 rounded-xl">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const supabaseUrl = 'https://rxqtsguwoqeojsnaagxb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4cXRzZ3V3b3Flb2pzbmFhZ3hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTA4MjcsImV4cCI6MjEwMjcyNjgyN30.FTPTGSe6tqDTieqQdD-GWUqueKlEPUpw4QGiMa4U8AA';
     
        const supaClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null;
        let calendar = null;

        // Horloge
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-display').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date-display').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }, 1000);

        // --- 2. AUTHENTIFICATION ---
        window.login = async function() {
            const { data, error } = await supaClient.auth.signInWithPassword({ 
                email: document.getElementById('email').value, 
                password: document.getElementById('password').value 
            });
            if (!error) initialiserApp(data.user);
        };
        window.onload = async () => {
            const { data: { user } } = await supaClient.auth.getUser();
            if (user) initialiserApp(user);
        };

        function initialiserApp(user) {
            currentUser = user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('flex');
            chargerHistoriqueJour(); // Charge les pointages du jour
            initCalendar(); // Charge le calendrier et les soldes
        }

        // --- 3. GESTION DES POINTAGES (VRAI HISTORIQUE) ---
        async function chargerHistoriqueJour() {
            const debutJour = new Date();
            debutJour.setHours(0, 0, 0, 0);

            const { data, error } = await supaClient
                .from('pointages')
                .select('*')
                .eq('user_id', currentUser.id)
                .gte('timestamp', debutJour.toISOString())
                .order('timestamp', { ascending: false }); // Plus récent en premier

            const conteneur = document.getElementById('historique-jour');
            conteneur.innerHTML = '';

            if(data && data.length > 0) {
                data.forEach(p => {
                    const heure = new Date(p.timestamp).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                    
                    // Style conditionnel selon l'action
                    let label = p.type_action;
                    let couleurTexte = "text-gray-800";
                    if(label === 'arrivee') { label = "Prise de poste"; couleurTexte = "text-teal-600"; }
                    if(label === 'pause') { label = "Pause"; couleurTexte = "text-orange-500"; }
                    if(label === 'depart') { label = "Fin de poste"; couleurTexte = "text-slate-600"; }

                    conteneur.innerHTML += `
                        <div class="flex justify-between items-center py-3 border-b border-gray-50">
                            <div class="font-medium ${couleurTexte} capitalize">${label}</div>
                            <div class="text-gray-500 text-sm">${heure}</div>
                        </div>
                    `;
                });
            } else {
                conteneur.innerHTML = '<div class="flex justify-center items-center h-full text-gray-400">Aucun pointage aujourd\'hui.</div>';
            }
        }

        window.pointer = async function(type) {
            if (!currentUser) return;
            await supaClient.from('pointages').insert([{ user_id: currentUser.id, type_action: type }]);
            chargerHistoriqueJour(); // Met à jour la liste immédiatement !
        };

        // --- 4. GESTION DES SOLDES ET ABSENCES ---
        async function chargerSoldesEtCalculs(absencesVues) {
            // 1. Récupérer les paramètres de base
            let { data: params } = await supaClient.from('parametres').select('*').eq('user_id', currentUser.id).single();
            
            // Si pas de paramètres enregistrés, on met des valeurs par défaut
            if(!params) { params = { cp_initial: 25, rtt_initial: 15 }; }

            // 2. Calculer le consommé
            let cpConsommes = 0;
            let rttConsommes = 0;
            let joursNovFev = 0; // Pour le fractionnement

            absencesVues.forEach(abs => {
                // Calcul du nombre de jours entre debut et fin
                const debut = new Date(abs.date_debut);
                const fin = new Date(abs.date_fin);
                // +1 car si on pose du Lundi au Lundi, ça fait 1 jour, pas 0.
                const diffJours = Math.round((fin - debut) / (1000 * 60 * 60 * 24)) + 1; 

                if(abs.type_absence === 'CP') {
                    cpConsommes += diffJours;
                    // Vérification Novembre à Février
                    for (let j = new Date(debut); j <= fin; j.setDate(j.getDate() + 1)) {
                        if([10, 11, 0, 1].includes(j.getMonth())) joursNovFev++;
                    }
                }
                if(abs.type_absence === 'RTT') rttConsommes += diffJours;
            });

            // 3. Affichage Restant (Initial - Consommé)
            document.getElementById('cpt-cp').textContent = (params.cp_initial - cpConsommes) + ' j';
            document.getElementById('cpt-rtt').textContent = (params.rtt_initial - rttConsommes) + ' j';

            // Alerte RTT obligatoire : vérifie si on est dans le mois en cours et s'il reste des RTT
            if((params.rtt_initial - rttConsommes) > 0) {
                document.getElementById('alerte-rtt').classList.remove('hidden');
            }

            // 4. Fractionnement
            let fractionnement = 0;
            if (joursNovFev >= 8) fractionnement = 2;
            else if (joursNovFev >= 6) fractionnement = 1;
            document.getElementById('cpt-fractionnement').textContent = `+${fractionnement} j`;
        }

        // --- 5. CALENDRIER ---
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fr',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                events: async function(info, successCallback, failureCallback) {
                    const { data, error } = await supaClient.from('absences').select('*').eq('user_id', currentUser.id);
                    if (error) { failureCallback(error); return; }

                    chargerSoldesEtCalculs(data); // Met à jour les compteurs avec les données réelles

                    const events = data.map(abs => {
                        let color = '#3b82f6'; 
                        if(abs.type_absence === 'CP') color = '#14b8a6'; 
                        if(abs.type_absence === 'Maladie') color = '#ef4444'; 
                        return {
                            title: abs.type_absence,
                            start: abs.date_debut,
                            end: new Date(new Date(abs.date_fin).getTime() + 86400000).toISOString().split('T')[0], 
                            backgroundColor: color, borderColor: color
                        };
                    });
                    successCallback(events);
                }
            });
        }

        window.switchTab = function(tabName) {
            document.getElementById('view-pointage').classList.add('hidden');
            document.getElementById('view-planning').classList.add('hidden');
            document.getElementById('btn-pointage').classList.remove('bg-teal-50', 'text-teal-700');
            document.getElementById('btn-planning').classList.remove('bg-teal-50', 'text-teal-700');

            if (tabName === 'pointage') {
                document.getElementById('view-pointage').classList.remove('hidden');
                document.getElementById('view-pointage').classList.add('flex');
                document.getElementById('btn-pointage').classList.add('bg-teal-50', 'text-teal-700');
                chargerHistoriqueJour(); // Rafraîchit l'historique quand on revient dessus
            } else {
                document.getElementById('view-planning').classList.remove('hidden');
                document.getElementById('view-planning').classList.add('flex');
                document.getElementById('btn-planning').classList.add('bg-teal-50', 'text-teal-700');
                if(calendar) calendar.render();
            }
        };

        // --- 6. MODALES ---
        window.ouvrirModalAbsence = () => document.getElementById('modal-absence').classList.remove('hidden');
        window.fermerModalAbsence = () => document.getElementById('modal-absence').classList.add('hidden');
        
        window.sauvegarderAbsence = async () => {
            const { error } = await supaClient.from('absences').insert([{ 
                user_id: currentUser.id, 
                type_absence: document.getElementById('type_absence').value, 
                date_debut: document.getElementById('date_debut').value, 
                date_fin: document.getElementById('date_fin').value 
            }]);
            fermerModalAbsence();
            calendar.refetchEvents(); // Recharge le calendrier ET les soldes !
        };

        window.ouvrirModalParametres = async () => {
            const { data } = await supaClient.from('parametres').select('*').eq('user_id', currentUser.id).single();
            if(data) {
                document.getElementById('input_cp').value = data.cp_initial;
                document.getElementById('input_rtt').value = data.rtt_initial;
            }
            document.getElementById('modal-parametres').classList.remove('hidden');
        };
        window.fermerModalParametres = () => document.getElementById('modal-parametres').classList.add('hidden');
        
        window.sauvegarderParametres = async () => {
            const cp = document.getElementById('input_cp').value;
            const rtt = document.getElementById('input_rtt').value;
            
            await supaClient.from('parametres').upsert({ 
                user_id: currentUser.id, cp_initial: cp, rtt_initial: rtt 
            });
            fermerModalParametres();
            calendar.refetchEvents(); // Recalcule les restants
        };
    </script>
</body>
</html>
